# LLM Provider 配置
# 当前使用 mock，后续切换为真实 provider
#
# 支持的 provider:
#   - mock       (开发测试)
#   - openai     (GPT-4, GPT-4o)
#   - deepseek   (DeepSeek-V2)
#   - ollama     (本地模型)
#   - claude     (Claude 3.5)
#   - gemini     (Gemini Pro)

llm:
  provider: mock

  # 模型配置
  model: mock-llm-v1
  temperature: 0.7
  max_tokens: 4096

  # API 配置 (通过环境变量读取密钥)
  api_base: ""
  api_key_env: ""         # 环境变量名，如 OPENAI_API_KEY

  # Provider 特有配置
  extra: {}